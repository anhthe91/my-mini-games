<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trận Chiến Ma Thuật Phím Số - Ultimate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #05050d;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #1a233a;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #0a0a16, #05050d);
        }
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.7);
        }
        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 13, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            backdrop-filter: blur(8px);
        }
        h1 {
            font-size: 34px;
            color: #00e5ff;
            text-shadow: 0 0 20px #00e5ff;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 15px;
            color: #a0aabf;
            margin-bottom: 20px;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }
        .difficulty-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .diff-btn {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            color: #a0aabf;
            background: #101626;
            border: 2px solid #1a233a;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .diff-btn:hover {
            border-color: #00e5ff;
            color: #fff;
        }
        .diff-btn.active {
            background: #00e5ff;
            color: #05050d;
            border-color: #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
        }
        .btn-start {
            padding: 12px 40px;
            font-size: 18px;
            font-weight: bold;
            color: #05050d;
            background: #00e5ff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
            transition: all 0.2s ease;
        }
        .btn-start:hover {
            background: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="850" height="600"></canvas>
    
    <div class="ui-overlay">
        <div class="hud">
            <div id="score-display">ĐIỂM: 0</div>
            <div id="combo-display">COMBO: x0</div>
        </div>
    </div>

    <!-- Màn hình bắt đầu -->
    <div id="start-screen">
        <h1>MA THUẬT PHÍM SỐ</h1>
        <p>Gõ nhanh các chuỗi <b>Phím Số (1-9)</b> để kích hoạt đại bác ma thuật tiêu diệt quái vật bảo vệ 3 Cột Năng Lượng!</p>
        
        <div style="margin-bottom: 8px; font-weight: bold; color: #00e5ff;">CHỌN ĐỘ KHÓ:</div>
        <div class="difficulty-container">
            <button class="diff-btn" data-mode="easy">DỄ</button>
            <button class="diff-btn active" data-mode="normal">TRUNG BÌNH</button>
            <button class="diff-btn" data-mode="hard">KHÓ</button>
            <button class="diff-btn" data-mode="insane" style="color: #ff3366;">SIÊU KHÓ</button>
        </div>

        <button id="start-btn" class="btn-start">BẮT ĐẦU CHƠI</button>
    </div>

    <!-- Màn hình kết thúc -->
    <div id="game-over-screen" class="hidden">
        <h1>THÁP ĐÃ SỤP ĐỔ</h1>
        <p id="final-score">Điểm số: 0</p>
        <button id="restart-btn" class="btn-start">CHƠI LẠI</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const scoreDisplay = document.getElementById('score-display');
const comboDisplay = document.getElementById('combo-display');
const finalScore = document.getElementById('final-score');

// Quản lý Độ Khó
let currentDifficulty = 'normal';
const diffBtns = document.querySelectorAll('.diff-btn');
diffBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        diffBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentDifficulty = btn.dataset.mode;
    });
});

const DIFFICULTY_SETTINGS = {
    easy:   { minLen: 2, maxLen: 3, baseSpeed: 0.6, interval: 140, name: 'Dễ' },
    normal: { minLen: 2, maxLen: 4, baseSpeed: 0.9, interval: 110, name: 'Trung Bình' },
    hard:   { minLen: 3, maxLen: 5, baseSpeed: 1.3, interval: 85,  name: 'Khó' },
    insane: { minLen: 4, maxLen: 6, baseSpeed: 1.8, interval: 60,  name: 'Siêu Khó' }
};

// Web Audio API
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
}

function playSound(freq, type = 'sine', duration = 0.1, vol = 0.1) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
}

// Biến trạng thái Game
let gameRunning = false;
let score = 0;
let combo = 0;
let lives = 3; // 3 Cột tương ứng 3 mạng
let enemies = [];
let particles = [];
let spells = [];
let spawnTimer = 0;
let spawnInterval = 110;
let shakeTime = 0;

const player = {
    x: 120,
    y: canvas.height / 2,
    radius: 35
};

// Cấu hình 3 Cột Năng Lượng (3 Mạng)
const pillars = [
    { x: 40, y: canvas.height / 2 - 90, active: true },
    { x: 30, y: canvas.height / 2,      active: true },
    { x: 40, y: canvas.height / 2 + 90, active: true }
];

class Enemy {
    constructor() {
        const setting = DIFFICULTY_SETTINGS[currentDifficulty];
        this.x = canvas.width + 50;
        this.y = Math.random() * (canvas.height - 160) + 80;
        this.speed = setting.baseSpeed + Math.random() * 0.4 + (score / 1000);
        this.radius = 22;
        
        // Tạo chuỗi số phép thuật ngẫu nhiên
        const len = Math.floor(Math.random() * (setting.maxLen - setting.minLen + 1)) + setting.minLen;
        this.code = "";
        for (let i = 0; i < len; i++) {
            this.code += Math.floor(Math.random() * 9 + 1).toString();
        }
        this.currentMatched = 0;
        this.color = `hsl(${Math.random() * 60 + 320}, 85%, 60%)`;
    }

    update() {
        this.x -= this.speed;
    }

    draw() {
        ctx.save();
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Mắt quái
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(this.x - 6, this.y - 4, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(this.x - 8, this.y - 4, 2, 0, Math.PI * 2);
        ctx.fill();

        // Bảng hiển thị chuỗi số trên đầu
        ctx.font = 'bold 18px Courier New';
        const codeWidth = ctx.measureText(this.code).width;
        
        ctx.fillStyle = 'rgba(10, 10, 25, 0.85)';
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 1.5;
        ctx.fillRect(this.x - codeWidth / 2 - 8, this.y - 48, codeWidth + 16, 26);
        ctx.strokeRect(this.x - codeWidth / 2 - 8, this.y - 48, codeWidth + 16, 26);

        let currentX = this.x - codeWidth / 2;
        for (let i = 0; i < this.code.length; i++) {
            const char = this.code[i];
            ctx.fillStyle = (i < this.currentMatched) ? '#00e5ff' : '#ffffff';
            ctx.fillText(char, currentX, this.y - 30);
            currentX += ctx.measureText(char).width;
        }
        ctx.restore();
    }
}

class Spell {
    constructor(startX, startY, targetX, targetY, color) {
        this.x = startX;
        this.y = startY;
        this.targetX = targetX;
        this.targetY = targetY;
        this.color = color;
        this.speed = 18;
        const angle = Math.atan2(targetY - startY, targetX - startX);
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.active = true;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;

        for (let i = 0; i < 2; i++) {
            particles.push(new Particle(this.x, this.y, this.color, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, Math.random() * 3 + 1));
        }

        const dist = Math.hypot(this.targetX - this.x, this.targetY - this.y);
        if (dist < 18) {
            this.active = false;
            createExplosion(this.targetX, this.targetY, this.color, 15);
        }
    }

    draw() {
        ctx.save();
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color, vx, vy, size) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = vx;
        this.vy = vy;
        this.size = size;
        this.alpha = 1;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.02;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function createExplosion(x, y, color, count = 20) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 1;
        particles.push(new Particle(
            x, y, color,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed,
            Math.random() * 4 + 2
        ));
    }
}

// Vẽ Cột Năng Lượng (Biểu tượng Mạng)
function drawPillars() {
    pillars.forEach((p) => {
        if (!p.active) return;

        ctx.save();
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 15;
        
        // Thân Cột Pha Lê
        ctx.fillStyle = '#00e5ff';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - 30);
        ctx.lineTo(p.x + 12, p.y - 10);
        ctx.lineTo(p.x + 12, p.y + 20);
        ctx.lineTo(p.x, p.y + 30);
        ctx.lineTo(p.x - 12, p.y + 20);
        ctx.lineTo(p.x - 12, p.y - 10);
        ctx.closePath();
        ctx.fill();

        // Lớp Phản Quang Nội Bổ
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - 20);
        ctx.lineTo(p.x + 5, p.y - 5);
        ctx.lineTo(p.x, p.y + 15);
        ctx.lineTo(p.x - 5, p.y - 5);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    });
}

// Xử lý Sự Kiện Bàn Phím
window.addEventListener('keydown', (e) => {
    if (!gameRunning) return;
    if (e.key >= '1' && e.key <= '9') {
        processInput(e.key);
    }
});

function processInput(digit) {
    initAudio();
    let targetEnemy = null;
    let minDistance = Infinity;

    // Ưu tiên chọn quái vật đứng gần nhất
    for (let enemy of enemies) {
        if (enemy.code[enemy.currentMatched] === digit) {
            const dist = enemy.x - player.x;
            if (dist < minDistance) {
                minDistance = dist;
                targetEnemy = enemy;
            }
        }
    }

    if (targetEnemy) {
        targetEnemy.currentMatched++;
        playSound(450 + targetEnemy.currentMatched * 90, 'sine', 0.08, 0.15);
        spells.push(new Spell(player.x, player.y, targetEnemy.x, targetEnemy.y, '#00e5ff'));

        if (targetEnemy.currentMatched >= targetEnemy.code.length) {
            playSound(750, 'triangle', 0.15, 0.2);
            combo++;
            score += 10 * combo;
            enemies = enemies.filter(e => e !== targetEnemy);
            shakeTime = 4;
        }
    } else {
        // Gõ sai -> Mất Combo
        combo = 0;
        playSound(140, 'sawtooth', 0.15, 0.1);
    }

    updateHUD();
}

function updateHUD() {
    scoreDisplay.innerText = `ĐIỂM: ${score}`;
    comboDisplay.innerText = `COMBO: x${combo}`;
}

function gameLoop() {
    if (!gameRunning) return;

    ctx.save();
    if (shakeTime > 0) {
        ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
        shakeTime--;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Vẽ 3 Cột Năng Lượng (Mạng)
    drawPillars();

    // Vẽ Tháp Ma Thuật Trung Tâm
    ctx.save();
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#00e5ff';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius + 8 + Math.sin(Date.now() / 200) * 3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // Sinh quái vật
    spawnTimer++;
    if (spawnTimer >= spawnInterval) {
        enemies.push(new Enemy());
        spawnTimer = 0;
        if (spawnInterval > 35) spawnInterval -= 0.4;
    }

    // Cập nhật Đạn
    spells.forEach((spell, index) => {
        spell.update();
        spell.draw();
        if (!spell.active) spells.splice(index, 1);
    });

    // Cập nhật Quái vật
    enemies.forEach((enemy, index) => {
        enemy.update();
        enemy.draw();

        // Xử lý khi quái chạm tới tháp
        if (enemy.x - enemy.radius <= player.x + player.radius) {
            lives--;
            shakeTime = 20;
            playSound(100, 'square', 0.4, 0.3);

            // Phá hủy 1 cột năng lượng tương ứng
            if (lives >= 0 && lives < 3) {
                const destroyedPillar = pillars[lives];
                destroyedPillar.active = false;
                createExplosion(destroyedPillar.x, destroyedPillar.y, '#00e5ff', 40);
            }

            createExplosion(enemy.x, enemy.y, '#ff0055', 30);
            enemies.splice(index, 1);

            if (lives <= 0) {
                endGame();
            }
        }
    });

    // Cập nhật Hạt
    particles.forEach((p, index) => {
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(index, 1);
    });

    ctx.restore();

    requestAnimationFrame(gameLoop);
}

function startGame() {
    initAudio();
    const setting = DIFFICULTY_SETTINGS[currentDifficulty];
    
    gameRunning = true;
    score = 0;
    combo = 0;
    lives = 3;
    enemies = [];
    particles = [];
    spells = [];
    spawnInterval = setting.interval;
    spawnTimer = 0;

    // Reset trạng thái 3 cột mạng
    pillars.forEach(p => p.active = true);
    
    updateHUD();
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    
    requestAnimationFrame(gameLoop);
}

function endGame() {
    gameRunning = false;
    finalScore.innerHTML = `Tổng Điểm: <b>${score}</b><br>Độ khó: <b>${DIFFICULTY_SETTINGS[currentDifficulty].name}</b>`;
    gameOverScreen.classList.remove('hidden');
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);
</script>

</body>
</html>
